global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: quizgen

scrape_configs:
  # ── Spring Boot (Micrometer + Prometheus) ─────────────────────────────────
  - job_name: 'quizgen-backend'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: '/api/v1/actuator/prometheus'
    scrape_interval: 10s

  # ── FastAPI NLP (prometheus-client) ──────────────────────────────────────
  - job_name: 'quizgen-nlp'
    static_configs:
      - targets: ['nlp-service:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ── Redis Exporter (optionnel) ────────────────────────────────────────────
  # - job_name: 'redis-exporter'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # ── Prometheus lui-même ──────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
