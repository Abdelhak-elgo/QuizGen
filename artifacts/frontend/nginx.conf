server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Défaut nginx = 1 Mo (413 avant même d'atteindre le backend).
    # Aligné avec spring.servlet.multipart (50 Mo par fichier).
    client_max_body_size 52m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # DNS interne Docker : le nom « backend » est re-résolu (TTL 10 s). Sans
    # cela, nginx fige l'IP au démarrage et chaque recréation du conteneur
    # backend (nouvelle IP) casse l'API (502) jusqu'au redémarrage du frontend.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/v1/ {
        # proxy_pass avec variable = résolution à chaque requête ; l'URI
        # d'origine (/api/v1/...) est transmise telle quelle.
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
