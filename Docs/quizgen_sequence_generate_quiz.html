
<style>
#seq1 { padding: 8px 0; }
</style>
<div id="seq1"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    actorBkg: dark ? '#3C3489' : '#EEEDFE',
    actorBorder: dark ? '#AFA9EC' : '#534AB7',
    actorTextColor: dark ? '#CECBF6' : '#26215C',
    activationBkgColor: dark ? '#444441' : '#F1EFE8',
    activationBorderColor: dark ? '#B4B2A9' : '#5F5E5A',
    signalColor: dark ? '#c2c0b6' : '#3d3d3a',
    noteBkgColor: dark ? '#085041' : '#E1F5EE',
    noteBorderColor: dark ? '#5DCAA5' : '#0F6E56',
    noteTextColor: dark ? '#9FE1CB' : '#04342C',
  },
});
const { svg } = await mermaid.render('seq1-svg', `sequenceDiagram
    actor E as Enseignant
    participant F as Frontend React
    participant B as Spring Boot API
    participant DB as PostgreSQL
    participant R as Redis
    participant P as FastAPI (NLP)
    participant M as Mistral LLM

    E->>F: Upload PDF + config quiz
    F->>B: POST /api/v1/documents/upload (JWT)
    B->>B: Valider JWT + rôle ENSEIGNANT
    B->>DB: Sauvegarder métadonnées Document
    B-->>F: 201 Created (documentId)

    E->>F: Lancer génération
    F->>B: POST /api/v1/quiz/generate
    B->>R: Publier tâche async (Celery)
    R-->>P: Consommer tâche

    activate P
    P->>P: PyMuPDF : extraction texte PDF
    P->>P: SpaCy : POS tagging + NER
    P->>P: KeyBERT : extraction concepts
    P->>M: Prompt structuré (concepts + config)
    M-->>P: JSON (questions + options + réponses)
    P->>P: Post-traitement (dédup ROUGE, validation)
    deactivate P

    P-->>R: Résultat quiz généré
    R-->>B: Callback résultat
    B->>DB: Sauvegarder Quiz + Questions
    B-->>F: 200 OK (quiz complet)
    F-->>E: Afficher quiz éditable
`);
document.getElementById('seq1').innerHTML = svg;
</script>
