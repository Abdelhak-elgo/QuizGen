
<style>
#erd { padding: 8px 0; }
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
    USERS ||--o{ DOCUMENTS : "importe"
    USERS ||--o{ QUIZZES : "cree"
    USERS ||--o{ ATTEMPTS : "passe"
    USERS ||--o{ SESSIONS : "cree"
    DOCUMENTS ||--o{ QUIZZES : "genere"
    QUIZZES ||--o{ QUESTIONS : "contient"
    QUIZZES ||--o{ SESSIONS : "expose"
    QUIZZES ||--|| ANALYTICS : "mesure"
    SESSIONS ||--o{ ATTEMPTS : "recoit"

    USERS {
        bigserial id PK
        varchar email UK
        varchar password_hash
        varchar first_name
        varchar last_name
        role_enum role
        boolean active
        timestamp created_at
    }

    DOCUMENTS {
        bigserial id PK
        varchar filename
        varchar original_name
        text content_text
        bigint file_size
        varchar file_path
        integer page_count
        jsonb keywords
        bigint uploaded_by FK
        timestamp uploaded_at
    }

    QUIZZES {
        bigserial id PK
        varchar title
        text description
        difficulty_enum difficulty
        integer nb_questions
        jsonb config
        varchar status
        bigint document_id FK
        bigint created_by FK
        timestamp created_at
    }

    QUESTIONS {
        bigserial id PK
        bigint quiz_id FK
        question_type_enum type
        text text
        jsonb options
        text correct_answer
        text explanation
        text hint
        integer order_index
        float points
    }

    SESSIONS {
        bigserial id PK
        bigint quiz_id FK
        varchar access_code UK
        session_status_enum status
        integer duration
        timestamp start_time
        timestamp end_time
        integer max_attempts
        boolean shuffle_questions
        bigint created_by FK
    }

    ATTEMPTS {
        bigserial id PK
        bigint session_id FK
        bigint user_id FK
        attempt_status_enum status
        float score
        float total_points
        integer duration
        jsonb answers
        timestamp started_at
        timestamp submitted_at
    }

    ANALYTICS {
        bigserial id PK
        bigint quiz_id FK
        integer total_attempts
        float avg_score
        float avg_duration
        float pass_rate
        jsonb question_stats
        jsonb score_distribution
        timestamp computed_at
    }
`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
