# ── QuizGen — Configuration SonarQube ────────────────────────────────────────
# Exécution :
#   mvn -B verify sonar:sonar \
#     -Dsonar.projectKey=quizgen-backend \
#     -Dsonar.host.url=$SONAR_HOST_URL \
#     -Dsonar.token=$SONAR_TOKEN
# ─────────────────────────────────────────────────────────────────────────────

sonar.projectKey=quizgen-backend
sonar.projectName=QuizGen Backend
sonar.projectVersion=1.0.0

# Sources Java
sonar.sources=backend/src/main/java
sonar.tests=backend/src/test/java
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Couverture JaCoCo
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Encodage
sonar.sourceEncoding=UTF-8

# ── Exclusions ───────────────────────────────────────────────────────────────
# Exclure les classes générées, DTOs simples et configs boilerplate
sonar.exclusions=\
  **/entity/**/*_.java,\
  **/QuizGenApplication.java,\
  **/config/SwaggerConfig.java,\
  **/config/RestTemplateConfig.java

# Exclure les tests de la couverture de code
sonar.coverage.exclusions=\
  **/config/**,\
  **/entity/**,\
  **/dto/**,\
  **/QuizGenApplication.java

# ── Seuils Quality Gate ────────────────────────────────────────────────────
# Les seuils sont définis côté serveur SonarQube, mais ces valeurs
# servent de référence pour le Quality Gate "QuizGen Gate" :
#
#   - Couverture de code :         >= 70 %
#   - Duplication :                <= 10 %
#   - Bugs critiques :             = 0
#   - Vulnerabilités :             = 0
#   - Code Smells (new code) :     <= 20
#   - Rating Fiabilité :           >= B
#   - Rating Sécurité :            >= B
#
# Configurer via : Serveur SonarQube > Quality Gates > Créer "QuizGen Gate"

# ── Python NLP service (optionnel, si SonarQube supporte Python) ──────────
# sonar.python.version=3.11
# sonar.python.coverage.reportPaths=nlp-service/coverage.xml
