name: "E2E & Qualite IA - QuizGen"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_ai_quality:
        description: "Lancer l'evaluation qualite IA (slow - ~30 min)"
        type: boolean
        default: false

jobs:
  # ── Job 1 : Tests E2E Playwright ───────────────────────────────────────────
  e2e:
    name: Tests E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       quizgen_e2e
          POSTGRES_USER:     quizgen
          POSTGRES_PASSWORD: e2e_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node + Playwright ─────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright & dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      # ── Keycloak (port 8180) ──────────────────────────────────────────────
      - name: Start Keycloak
        run: |
          docker run -d \
            --name keycloak-e2e \
            --network host \
            -e KEYCLOAK_ADMIN=admin \
            -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -e KC_DB=dev-mem \
            -e KC_HTTP_ENABLED=true \
            -e KC_HTTP_PORT=8180 \
            -e KC_HOSTNAME_STRICT=false \
            -v "${{ github.workspace }}/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:25.0 \
            start-dev --import-realm
          echo "Attente demarrage Keycloak (max 150s)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8180/health/ready; then
              echo "Keycloak pret."
              exit 0
            fi
            echo "  tentative $i/30..."
            sleep 5
          done
          echo "ERREUR: Keycloak n'a pas demarre a temps"
          docker logs keycloak-e2e
          exit 1

      # ── MinIO ─────────────────────────────────────────────────────────────
      - name: Start MinIO
        run: |
          docker run -d \
            --name minio-e2e \
            --network host \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          echo "Attente MinIO (max 30s)..."
          for i in $(seq 1 6); do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO pret."
              break
            fi
            sleep 5
          done
          docker run --rm --network host \
            minio/mc:latest \
            sh -c "mc alias set local http://localhost:9000 minioadmin minioadmin \
              && mc mb --ignore-existing local/documents \
              && mc mb --ignore-existing local/exports"

      # ── Spring Boot ───────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build Spring Boot (skip tests)
        working-directory: backend
        run: mvn -B package -DskipTests --no-transfer-progress

      - name: Start Spring Boot backend
        run: |
          java \
            -Dspring.datasource.url="jdbc:postgresql://localhost:5432/quizgen_e2e" \
            -Dspring.datasource.username=quizgen \
            -Dspring.datasource.password=e2e_secret \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            -Dspring.security.oauth2.resourceserver.jwt.issuer-uri="http://localhost:8180/realms/quizgen" \
            -Dspring.security.oauth2.resourceserver.jwt.jwk-set-uri="http://localhost:8180/realms/quizgen/protocol/openid-connect/certs" \
            -Dkeycloak.url="http://localhost:8180" \
            -Dkeycloak.realm=quizgen \
            -Dminio.url="http://localhost:9000" \
            -Dminio.access-key=minioadmin \
            -Dminio.secret-key=minioadmin \
            -Dnlp.service.url="http://localhost:8000" \
            -jar backend/target/quizgen-backend-*.jar \
            > /tmp/backend.log 2>&1 &
          echo "Attente demarrage Spring Boot (max 120s)..."
          for i in $(seq 1 24); do
            if curl -sf http://localhost:8080/api/v1/actuator/health; then
              echo "Backend pret."
              exit 0
            fi
            echo "  tentative $i/24..."
            sleep 5
          done
          echo "ERREUR: Spring Boot n'a pas demarre a temps"
          tail -50 /tmp/backend.log
          exit 1

      # ── Frontend Vite ─────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Start frontend dev server
        run: |
          PORT=4321 pnpm --filter @workspace/frontend run dev > /tmp/frontend.log 2>&1 &
          echo "Attente demarrage Vite (max 60s)..."
          for i in $(seq 1 12); do
            if curl -sf http://localhost:4321/frontend/ > /dev/null 2>&1; then
              echo "Frontend pret."
              exit 0
            fi
            echo "  tentative $i/12..."
            sleep 5
          done
          echo "AVERTISSEMENT: Frontend pas encore pret - les tests peuvent echouer"
          tail -20 /tmp/frontend.log || true

      # ── Utilisateurs de test Keycloak ─────────────────────────────────────
      - name: Create E2E test users in Keycloak
        run: |
          # Obtenir un token admin
          ADMIN_TOKEN=$(curl -sf \
            -X POST "http://localhost:8180/realms/master/protocol/openid-connect/token" \
            -d "grant_type=password&client_id=admin-cli&username=admin&password=admin" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ERREUR: Impossible d'obtenir le token admin Keycloak"
            exit 1
          fi

          # Enseignant de test
          curl -sf -X POST "http://localhost:8180/admin/realms/quizgen/users" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"username":"prof.test@quizgen.ma","email":"prof.test@quizgen.ma","enabled":true,"credentials":[{"type":"password","value":"Test1234!","temporary":false}]}' || true

          # Etudiant de test
          curl -sf -X POST "http://localhost:8180/admin/realms/quizgen/users" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"username":"etudiant.test@quizgen.ma","email":"etudiant.test@quizgen.ma","enabled":true,"credentials":[{"type":"password","value":"Test1234!","temporary":false}]}' || true

          echo "Utilisateurs de test crees."

      # ── Tests E2E ─────────────────────────────────────────────────────────
      - name: Run Playwright E2E tests
        working-directory: e2e
        run: npx playwright test --reporter=github,html
        env:
          BASE_URL:          "http://localhost:4321/frontend"
          KC_URL:            "http://localhost:8180"
          KC_REALM:          "quizgen"
          TEST_TEACHER_USER: "prof.test@quizgen.ma"
          TEST_TEACHER_PASS: "Test1234!"
          TEST_STUDENT_USER: "etudiant.test@quizgen.ma"
          TEST_STUDENT_PASS: "Test1234!"
          TEST_SESSION_CODE: "TEST01"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload JUnit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-junit-results
          path: e2e/results/junit.xml
          retention-days: 14

      - name: Print backend logs on failure
        if: failure()
        run: tail -100 /tmp/backend.log || true

  # ── Job 2 : Evaluation qualite IA ─────────────────────────────────────────
  ai-quality:
    name: "Evaluation qualite IA (BLEU/ROUGE/BERTScore)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_ai_quality == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install evaluation dependencies
        run: pip install --no-cache-dir sacrebleu rouge-score requests
        # bert-score non installe en CI (modele ~1.4 Go) -- mode dry-run

      - name: Run AI quality evaluation (dry-run)
        run: |
          python evaluation/evaluate.py \
            --dry-run \
            --output evaluation/rapport_qualite_ia.md

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: rapport-qualite-ia
          path: evaluation/rapport_qualite_ia.md
          retention-days: 30

      - name: Display report summary
        run: head -30 evaluation/rapport_qualite_ia.md || true

  # ── Job 3 : Test de performance ────────────────────────────────────────────
  performance:
    name: Test de performance generation quiz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wrk
        run: sudo apt-get install -y wrk 2>/dev/null || true

      - name: Run performance script
        run: |
          chmod +x scripts/performance-test.sh
          bash scripts/performance-test.sh || echo "Performance test skipped (service non disponible)"
        env:
          # Utilise le secret si defini, sinon localhost (pas de service en CI)
          API_BASE_URL: ${{ secrets.STAGING_API_URL != '' && secrets.STAGING_API_URL || 'http://localhost:8080/api/v1' }}

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: scripts/performance-report.txt
          retention-days: 14
