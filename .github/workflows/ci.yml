name: "CI - QuizGen"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/quizgen-backend
  IMAGE_NLP:     ghcr.io/${{ github.repository_owner }}/quizgen-nlp

jobs:
  # ── Job 1 : Build & Tests Maven ─────────────────────────────────────────────
  build:
    name: Build & Tests Spring Boot
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       quizgen_test
          POSTGRES_USER:     quizgen
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and run tests with coverage
        working-directory: backend
        run: mvn -B verify --no-transfer-progress
        env:
          SPRING_DATASOURCE_URL:      jdbc:postgresql://localhost:5432/quizgen_test
          SPRING_DATASOURCE_USERNAME: quizgen
          SPRING_DATASOURCE_PASSWORD: test_password
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:8180/realms/quizgen"
          SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://localhost:8180/realms/quizgen/protocol/openid-connect/certs"

      - name: Publish Surefire test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: backend/target/surefire-reports/TEST-*.xml
          check_name: "Surefire Test Report"
          fail_on_failure: true

      - name: Upload coverage + surefire artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/jacoco.xml
          retention-days: 7

  # ── Job 2 : Tests NLP Python ─────────────────────────────────────────────────
  nlp-tests:
    name: Tests NLP FastAPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: nlp-service/requirements.txt

      - name: Install NLP dependencies (sans torch/bert-score)
        working-directory: nlp-service
        run: |
          # Installer les deps legeres seulement (torch ~2 Go = trop lent en CI)
          pip install --no-cache-dir \
            fastapi==0.115.0 \
            uvicorn==0.30.6 \
            pydantic==2.8.2 \
            pydantic-settings==2.4.0 \
            celery==5.4.0 \
            redis==5.0.8 \
            httpx==0.27.2 \
            pytest==8.3.2 \
            pytest-asyncio==0.23.8 \
            prometheus-client==0.21.0 \
            python-multipart==0.0.9

      - name: Run NLP tests (BERTScore mocke)
        working-directory: nlp-service
        run: pytest tests/ -v --tb=short --ignore=tests/test_integration.py 2>&1

      - name: Upload NLP test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nlp-test-results
          path: nlp-service/.pytest_cache/
          retention-days: 7

  # ── Job 3 : Analyse SonarQube ────────────────────────────────────────────────
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build
    # Uniquement sur push main/develop ET si SONAR_TOKEN est configure
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      vars.SONAR_ENABLED == 'true'

    services:
      # SonarQube a besoin que les tests passent avec coverage -> postgres requis
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       quizgen_test
          POSTGRES_USER:     quizgen
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historique complet pour SonarQube

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build, test et analyse SonarQube
        working-directory: backend
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=quizgen-backend \
            -Dsonar.projectName="QuizGen Backend" \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SPRING_DATASOURCE_URL:      jdbc:postgresql://localhost:5432/quizgen_test
          SPRING_DATASOURCE_USERNAME: quizgen
          SPRING_DATASOURCE_PASSWORD: test_password
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:8180/realms/quizgen"
          SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://localhost:8180/realms/quizgen/protocol/openid-connect/certs"

  # ── Job 4 : Docker Build — Backend Spring Boot ───────────────────────────────
  docker-backend:
    name: "Docker Build - Spring Boot"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 5 : Docker Build — FastAPI NLP ───────────────────────────────────────
  docker-nlp:
    name: "Docker Build - FastAPI NLP"
    runs-on: ubuntu-latest
    needs: nlp-tests
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NLP }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push NLP image
        uses: docker/build-push-action@v5
        with:
          context: ./nlp-service
          file: ./nlp-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
