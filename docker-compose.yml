# ============================================================
# QuizGen — Docker Compose (Développement)
# PFE Master MIAGE 2024/2025
# Usage : docker-compose up -d
# ============================================================

version: "3.9"

services:
  # ===================== PostgreSQL =====================
  postgres:
    image: postgres:16-alpine
    container_name: quizgen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quizgen-network

  # ===================== Redis =========================
  redis:
    image: redis:7-alpine
    container_name: quizgen-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quizgen-network

  # ===================== MinIO (S3) ====================
  minio:
    image: minio/minio:latest
    container_name: quizgen-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quizgen-network

  # ---- Création automatique des buckets MinIO ----
  minio-init:
    image: minio/mc:latest
    container_name: quizgen-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set quizgen http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing quizgen/${MINIO_BUCKET_DOCUMENTS};
        mc mb --ignore-existing quizgen/${MINIO_BUCKET_EXPORTS};
        mc anonymous set download quizgen/${MINIO_BUCKET_EXPORTS};
        echo '=== Buckets MinIO créés avec succès ===';
        exit 0;
      "
    networks:
      - quizgen-network

  # ===================== Ollama (Mistral LLM) ==========
  ollama:
    image: ollama/ollama:latest
    container_name: quizgen-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - quizgen-network
    # Décommenter pour GPU NVIDIA :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ===================== Keycloak =======================
  keycloak:
    container_name: quizgen-keycloak
    image: quay.io/keycloak/keycloak:26.4.1
    command:
      - "start-dev"
      - "--import-realm"
      - "--log-level=DEBUG"
      - "--http-port=8080"
      - "--hostname-strict=false"
      - "--hostname-strict-https=false"
      - "--health-enabled=true"
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_KEYCLOAK}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Import realm from volume
      KC_IMPORT_REALM: /opt/keycloak/data/import/realm-export.json
    ports:
      - "8090:8080" # Changed to avoid conflict with Spring API
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quizgen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    # ===================== Spring Boot API ===============
  spring-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - MAVEN_OPTS=-Xmx1024m
    container_name: quizgen-spring-api
    restart: unless-stopped
    environment:
      # ... (keep existing environment variables)
    ports:
      - "${SPRING_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - quizgen-network
    # Add build resources
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ===================== FastAPI NLP ===================
  fastapi-nlp:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: quizgen-fastapi-nlp
    restart: unless-stopped
    environment:
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS}
      # Redis (Celery broker)
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      # Ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    ports:
      - "${FASTAPI_PORT}:8000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - quizgen-network

# ===================== Volumes =========================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  ollama_data:
    driver: local
  keycloak_data:
    driver: local

# ===================== Network =========================
networks:
  quizgen-network:
    driver: bridge
    name: quizgen-network
