version: "3.9"

networks:
  quizgen-net:
    driver: bridge

volumes:
  postgres-data:
  keycloak-db-data:
  redis-data:
  minio-data:
  ollama-data:

# ──────────────────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL (app) ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: quizgen-postgres
    environment:
      POSTGRES_DB:       ${DB_NAME:-quizgen}
      POSTGRES_USER:     ${DB_USER:-quizgen}
      POSTGRES_PASSWORD: ${DB_PASS:-quizgen_secret_2025}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-quizgen} -d ${DB_NAME:-quizgen}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quizgen-net

  # ── PostgreSQL (Keycloak — base séparée) ────────────────────────────────────
  keycloak-db:
    image: postgres:16-alpine
    container_name: quizgen-keycloak-db
    environment:
      POSTGRES_DB:       keycloak
      POSTGRES_USER:     keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASS:-keycloak_secret_2025}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quizgen-net

  # ── Keycloak 25.0 ────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: quizgen-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB:              postgres
      KC_DB_URL:          jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME:     keycloak
      KC_DB_PASSWORD:     ${KC_DB_PASS:-keycloak_secret_2025}
      KEYCLOAK_ADMIN:     admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASS:-admin}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - quizgen-net

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: quizgen-redis
    command: redis-server --requirepass ${REDIS_PASS:-redis_secret_2025}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS:-redis_secret_2025}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quizgen-net

  # ── MinIO ───────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: quizgen-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_secret_2025}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console Web
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quizgen-net

  # ── MinIO Init (crée les buckets au démarrage) ───────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: quizgen-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minio_secret_2025};
        mc mb --ignore-existing local/documents;
        mc mb --ignore-existing local/exports;
        echo 'Buckets MinIO créés.';
      "
    networks:
      - quizgen-net

  # ── Ollama + Mistral ─────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: quizgen-ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - quizgen-net

  # ── Spring Boot API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quizgen-backend
    environment:
      DB_HOST:             postgres
      DB_PORT:             5432
      DB_NAME:             ${DB_NAME:-quizgen}
      DB_USER:             ${DB_USER:-quizgen}
      DB_PASS:             ${DB_PASS:-quizgen_secret_2025}
      KEYCLOAK_URL:        http://keycloak:8080
      KEYCLOAK_REALM:      quizgen
      MINIO_URL:           http://minio:9000
      MINIO_ACCESS_KEY:    ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY:    ${MINIO_SECRET_KEY:-minio_secret_2025}
      MINIO_BUCKET_DOCUMENTS: documents
      MINIO_BUCKET_EXPORTS:   exports
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quizgen-net
    restart: unless-stopped

  # ── FastAPI NLP ───────────────────────────────────────────────────────────────
  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: quizgen-nlp
    environment:
      REDIS_URL:        redis://:${REDIS_PASS:-redis_secret_2025}@redis:6379/0
      MINIO_URL:        http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio_secret_2025}
      OLLAMA_URL:       http://ollama:11434
      OLLAMA_MODEL:     ${OLLAMA_MODEL:-mistral}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - quizgen-net
    restart: unless-stopped

  # ── Celery Worker (génération asynchrone de quiz) ─────────────────────────────
  nlp-worker:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: quizgen-nlp-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 -Q celery
    environment:
      REDIS_URL:        redis://:${REDIS_PASS:-redis_secret_2025}@redis:6379/0
      MINIO_URL:        http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio_secret_2025}
      OLLAMA_URL:       http://ollama:11434
      OLLAMA_MODEL:     ${OLLAMA_MODEL:-mistral}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - quizgen-net
    restart: unless-stopped
