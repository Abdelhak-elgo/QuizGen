apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quizgen

resources:
  - namespace.yaml
  - secrets.yaml

  # Infrastructure
  - postgres/pvc.yaml
  - postgres/configmap-init.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml

  - redis/deployment.yaml
  - redis/service.yaml

  - minio/pvc.yaml
  - minio/deployment.yaml
  - minio/service.yaml

  - ollama/pvc.yaml
  - ollama/deployment.yaml
  - ollama/service.yaml

  - keycloak/deployment.yaml
  - keycloak/service.yaml

  # Application
  - backend/configmap.yaml
  - backend/deployment.yaml
  - backend/service.yaml

  - nlp-service/configmap.yaml
  - nlp-service/deployment.yaml
  - nlp-service/service.yaml

  - nlp-worker/deployment.yaml

  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/ingress.yaml

  # Monitoring
  - monitoring/prometheus-deployment.yaml
  - monitoring/grafana-deployment.yaml

# Images overridable via kustomize edit set image
images:
  - name: ghcr.io/abdelhak-elgo/quizgen-backend
    newTag: latest
  - name: ghcr.io/abdelhak-elgo/quizgen-nlp
    newTag: latest
  - name: ghcr.io/abdelhak-elgo/quizgen-frontend
    newTag: latest

# Génération du ConfigMap init-db depuis les fichiers SQL
configMapGenerator:
  - name: postgres-init-scripts
    files:
      - init-db/01-schema.sql
      - init-db/02-phase5-migration.sql
    options:
      disableNameSuffixHash: true
