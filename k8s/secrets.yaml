# ============================================================
# QuizGen — Kubernetes Secrets (TEMPLATE)
# NE PAS committer avec de vraies valeurs !
# Créer les secrets via :
#   kubectl create secret generic quizgen-secrets \
#     --from-env-file=.env.prod \
#     -n quizgen
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: quizgen-secrets
  namespace: quizgen
  labels:
    app.kubernetes.io/part-of: quizgen-platform
type: Opaque
stringData:
  # PostgreSQL
  DB_PASS: "CHANGE_ME_IN_PROD"
  # Keycloak
  KC_DB_PASS: "CHANGE_ME_IN_PROD"
  KC_ADMIN_PASS: "CHANGE_ME_IN_PROD"
  # Redis
  REDIS_PASS: "CHANGE_ME_IN_PROD"
  # MinIO
  MINIO_ACCESS_KEY: "CHANGE_ME_IN_PROD"
  MINIO_SECRET_KEY: "CHANGE_ME_IN_PROD"
  # JWT signing (utilisé par Keycloak)
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME_IN_PROD"
