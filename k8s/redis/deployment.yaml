apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: quizgen
  labels:
    app: redis
    app.kubernetes.io/part-of: quizgen-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASS)
            - --save
            - "60"
            - "1"
            - --loglevel
            - warning
          env:
            - name: REDIS_PASS
              valueFrom:
                secretKeyRef:
                  name: quizgen-secrets
                  key: REDIS_PASS
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASS)", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASS)", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}  # Remplacer par un PVC pour la persistance en prod
