apiVersion: v1
kind: ConfigMap
metadata:
  name: nlp-config
  namespace: quizgen
  labels:
    app: nlp-service
    app.kubernetes.io/part-of: quizgen-platform
data:
  MINIO_URL: "http://minio:9000"
  OLLAMA_URL: "http://ollama:11434"
  OLLAMA_MODEL: "mistral"
  SPACY_MODEL: "fr_core_news_lg"
  BERT_SCORE_MODEL: "roberta-large"
  BERT_SCORE_LANG: "fr"
  BERT_SCORE_THRESHOLD_CORRECT: "0.70"
  BERT_SCORE_THRESHOLD_PARTIAL: "0.50"
  # Cache Redis pour les extractions PDF (Phase 7)
  PDF_CACHE_TTL_SECONDS: "3600"
  PDF_CACHE_ENABLED: "true"
